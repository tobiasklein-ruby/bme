<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TKLST Reisen-Concierge · Anmelden</title>
<meta name="theme-color" content="#FBFAF4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TKLST Reisen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root { --bg: #FBFAF4; --fg: #1C1C1A; --muted: #6E6A5E; --olive: #6F6A52; --line: #E6E0D3; --bad: #B0462F; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 16px/1.5 "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif; padding: 24px 16px; }
form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
img { width: 88px; height: 88px; border-radius: 22px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
p { margin: 0; color: var(--muted); }
input { font: 18px inherit; font-family: inherit; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; width: 100%; }
button { min-height: 50px; border: 0; border-radius: 12px; background: var(--fg); color: var(--bg); font: 600 16px inherit; font-family: inherit; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.err { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<form method="post" action="/api/login">
  <img src="/icons/icon-192.png" alt="">
  <h1>TKLST Reisen-Concierge</h1>
  <p>Für Laura &amp; Toby. Einmal anmelden, danach bleibt die App ein Jahr angemeldet.</p>
  <label for="pw" style="font-weight:600">Passwort</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <p id="err" class="err" hidden>Das Passwort stimmt nicht. Bitte nochmal versuchen.</p>
  <button type="submit">Anmelden</button>
</form>
<script>if (location.search.includes("f=1")) document.getElementById("err").hidden = false;</script>
</body>
</html>
